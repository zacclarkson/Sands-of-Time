name: SoT
version: '${project.version}'
main: com.clarkson.sot.main.SoT
api-version: '26.2'
depend: [WorldEdit]
authors: [ZacClarkson]
description: A minecraft game based on MCC

commands:

  # --- Segment Builder Tool ---
  sotbuilder:
    description: Gives the single master segment builder tool (BLAZE_ROD).
    usage: /<command>
    permission: sot.admin.builder

  sotmode:
    description: Switches the segment builder tool mode.
    usage: /<command> <mode> [color|value|cost]
    permission: sot.admin.builder

  sotsavesegment:
    description: Saves the selected WorldEdit region as a new SoT segment template.
    usage: /<command> <name> <type>
    permission: sot.admin.savesegment

  sotclearmarkers:
    description: Removes all segment builder markers in your current world.
    usage: /<command>
    permission: sot.admin.builder

  sotundo:
    description: Removes the most recently placed segment builder marker.
    usage: /<command>
    permission: sot.admin.builder

  sotreloadsegments:
    description: Reloads segment templates from disk without restarting the server.
    usage: /<command>
    permission: sot.admin.savesegment

  # --- Game Control Commands ---
  sot:
    description: Main command for Sands of Time game control and location setup.
    usage: /<command> <setup|start|end|reset|set <lobby|trapped>|seed [<value>|random]>
    permission: sot.admin.control

permissions:

  sot.admin.builder:
    description: Allows using the segment builder tool and switching modes.
    default: op

  sot.admin.savesegment:
    description: Allows saving new SoT segment templates.
    default: op

  sot.admin.control:
    description: Allows controlling the SoT game state (setup, start, end) and setting game locations.
    default: op

  sot.admin.team:
    description: Allows managing SoT team assignments.
    default: op
