# Sands of Time configuration.
#
# Both locations below start unset. The plugin still enables without them, but
# /sot start will refuse to run until the lobby is set, so that a round is never
# generated somewhere nobody chose.
#
# To set them, either fill in the values here and restart, or stand where you
# want each one in-game and run:
#
#   /sot set lobby
#   /sot set trapped
#
# The command writes back to this file and applies immediately, so no restart is
# needed when you use it.

locations:

  # Where players are teleported when a round ends. This is also the anchor for
  # the visual sand timers, and its world is the world the team dungeons are
  # generated in.
  lobby:
    world: ''
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

  # Where a player is sent when their team's sand timer runs out. Also the
  # fallback destination when a player has no death cage assigned.
  trapped:
    world: ''
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

dungeon:

  # Dungeon generation seed. Leave blank (or write 'random') to roll a fresh
  # seed every round; set a value to make every round lay out identically --
  # same rooms, same vaults and keys, same loot and sand on the floor, for every
  # team.
  #
  # A value that is a whole number is used as the seed directly. Anything else
  # is hashed, so a memorable name works too:
  #
  #   seed: 4815162342
  #   seed: 'mcc-finals'
  #
  # The seed actually used is printed to the console when the dungeon is
  # generated, so a random layout worth keeping can be captured and replayed.
  # Stand anywhere and run /sot seed <value> to set this without a restart, or
  # /sot seed random to clear it.
  seed: ''

resource-pack:

  # Where players' clients download the Sands of Time texture pack (custom coin
  # and vault-key art). Leave blank to send no pack; everything still works,
  # players just see plain gold nuggets and tripwire hooks.
  #
  # The URL must be reachable from the PLAYERS' machines -- the server only
  # relays it. On the dev server this is the `pack` sidecar's published port,
  # e.g. http://<host>:25701/sot.zip.
  #
  # The plugin sends the zip's SHA-1 along with the URL, which is what makes a
  # client re-download a changed pack. It hashes the zip itself when the plugin
  # enables, so after replacing the zip a plugin reload (plugman reload SoT) is
  # all that is needed -- no server restart.
  url: ''

  # Optional. The zip's SHA-1 as 40 hex characters. Leave blank to have the
  # plugin download and hash the zip at enable; set it only if the URL above is
  # not reachable from the server itself.
  sha1: ''

  # Disconnect players who decline the pack. Off by default so a dev server
  # stays joinable from a client with packs disabled.
  required: false

  # Text shown in the client's "this server has a resource pack" prompt. Blank
  # uses a short default.
  prompt: ''
