# Rebuild the slim SoT resource pack and hot-swap it onto the homelab `pack` sidecar.
#
# The SoT plugin (not server.properties) offers the pack to clients, together with the zip's SHA-1,
# which it computes when it enables. So after replacing the served zip this job reloads just the SoT
# plugin over RCON (PlugManX, same as the jar deploy): the plugin re-hashes the new zip and offers it
# to everyone online, whose clients see a new hash and re-download. The MC container is never
# restarted, so nobody is kicked.
name: Deploy Resource Pack

on:
  push:
    branches: [ "master" ]
    paths:
      - "resourcepack/**"
      - "scripts/build-resourcepack.sh"
      - ".github/workflows/resourcepack-deploy.yml"
  workflow_dispatch:

jobs:
  # Gated like the jar deploy in maven-publish.yml: on a push it stays skipped until a self-hosted
  # runner is registered AND repo variable DEPLOY_ENABLED == "true". A manual workflow_dispatch run
  # is always allowed (so you can seed/repair the pack on demand).
  deploy-pack:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/master' &&
       vars.DEPLOY_ENABLED == 'true')
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build slim resource pack zip
        run: bash scripts/build-resourcepack.sh

      - name: Publish to the pack sidecar
        run: |
          # The `pack` nginx sidecar serves ~/servers/sot-test/pack over HTTP (port 25701).
          # Copy the freshly built zip in place; nginx serves it immediately, no restart.
          mkdir -p ~/servers/sot-test/pack
          cp target/sot-resourcepack.zip ~/servers/sot-test/pack/sot.zip
          echo "Published $(du -h target/sot-resourcepack.zip | cut -f1) pack to ~/servers/sot-test/pack/sot.zip"
          echo "sha1: $(sha1sum target/sot-resourcepack.zip | cut -d' ' -f1)"

      - name: Reload SoT so it re-hashes and re-offers the pack
        run: |
          # The plugin hashes the zip at enable and sends that hash with the pack, so a reload is
          # what turns the new file into a client re-download. rcon-cli exits 0 even on "Unknown
          # command", so inspect the reply and fail loudly rather than leave the old hash in play.
          reload_out=$(docker exec sot-test rcon-cli plugman reload SoT 2>&1)
          echo "plugman reply: $reload_out"
          if echo "$reload_out" | grep -qiE 'unknown command|not found|not enabled|no plugin|exception|error'; then
            echo "::error::plugman reload SoT failed (is PlugManX installed and SoT present?)"
            exit 1
          fi
          docker exec sot-test rcon-cli say "[SoT] Resource pack updated (${GITHUB_SHA:0:7}); accept the prompt to reload textures"
