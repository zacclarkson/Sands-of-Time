# Build + test the plugin, and (optionally) deploy the jar to the homelab sot-test server.
name: Build & Deploy Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # JDK 25 is required: Paper 26.2 is compiled against Java 25, and MockBukkit
      # v26.2 ships Java 25 bytecode.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # `verify` compiles, runs the JUnit/MockBukkit unit tests, and shades the jar.
      - name: Build with Maven
        run: mvn -B -ntp verify --file pom.xml

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SandsOfTime-Plugin-JAR
          path: target/SoT-*.jar
          if-no-files-found: error

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore

  # Deploys the freshly built jar to ~/servers/sot-test on the homelab and hot-reloads just the SoT
  # plugin (via PlugManX over RCON) so players are not kicked. Requires PlugManX to be installed on
  # the server (SPIGET_RESOURCES in compose.yml); if it is missing the reload step fails loudly.
  # Gated: stays skipped until a self-hosted runner is registered AND the repo variable
  # DEPLOY_ENABLED is set to "true" (see deploy/sot-test/README.md), so CI never hangs on a
  # missing runner.
  deploy:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - name: Download Plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: SandsOfTime-Plugin-JAR
          path: artifact

      - name: Deploy to sot-test and hot-reload
        run: |
          cp artifact/SoT-*.jar ~/servers/sot-test/data/plugins/SoT.jar
          # Hot-reload only the SoT plugin over RCON so connected players are not kicked.
          # PlugManX 'reload' unloads then reloads from disk, picking up the jar just copied.
          # rcon-cli exits 0 even when the server replies "Unknown command" (PlugManX missing),
          # so inspect the reply and fail on any error marker instead of silently no-op'ing.
          reload_out=$(docker exec sot-test rcon-cli plugman reload SoT 2>&1)
          echo "plugman reply: $reload_out"
          if echo "$reload_out" | grep -qiE 'unknown command|not found|not enabled|no plugin|exception|error'; then
            echo "::error::plugman reload SoT failed (is PlugManX installed and SoT present?)"
            exit 1
          fi
          # Announce the successful reload in-game (short commit SHA identifies the build).
          docker exec sot-test rcon-cli say "[SoT] Plugin reloaded to build ${GITHUB_SHA:0:7}"
