# Persistent Sands of Time test/dev server for the homelab.
#
# This is the version-controlled REFERENCE copy. The live file lives on the debian box at
# ~/servers/sot-test/compose.yml (see deploy/sot-test/README.md). Copy it there and
# `docker compose up -d`. A real Minecraft client connects to this to test the plugin's UX.
#
# Unlike integration-test/ (a throwaway offline harness driven by a bot), this server is
# always-on, online-mode, and keeps its world so segments/state persist between sessions.

services:
  sot-test:
    image: itzg/minecraft-server:java21
    container_name: sot-test
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      # Host port -> MC port. LAN/Tailscale only (no Cloudflare ingress; a game port is not HTTP).
      # Join at 100.125.118.2:25580 (Tailscale) or 192.168.1.250:25580 (LAN).
      # 25580 avoids clashing with crafty's managed 25565-25600 range.
      - "25580:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.1"
      MEMORY: "3G"
      # Real login: only you (an authenticated account) can join.
      ONLINE_MODE: "TRUE"
      # SoT hard-depends on WorldEdit (plugin.yml `depend: [WorldEdit]`). itzg auto-downloads it
      # from Modrinth into plugins/ on first boot and it then persists in ./data/plugins/.
      MODRINTH_PROJECTS: worldedit
      # Grant yourself op so all sot.admin.* perms apply. REPLACE with your Minecraft username.
      OPS: "REPLACE_WITH_MC_USERNAME"
      # A superflat world makes building segments and watching game UX easiest. Remove for normal.
      LEVEL_TYPE: "minecraft:flat"
    volumes:
      # World + config + plugins persist here. CI/scp drops the built jar at ./data/plugins/SoT.jar.
      - ./data:/data
    healthcheck:
      test: [ "CMD", "mc-health" ]
      start_period: 2m
      interval: 10s
      retries: 20
