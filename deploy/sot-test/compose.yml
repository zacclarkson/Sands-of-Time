# Persistent Sands of Time test/dev server for the homelab.
#
# This is the version-controlled REFERENCE copy. Deploy a copy to a working directory on your
# Docker host (see deploy/sot-test/README.md) and `docker compose up -d`. A real Minecraft client
# connects to this to test the plugin's UX. Fill in OPS with your Minecraft username.
#
# Unlike integration-test/ (a throwaway offline harness driven by a bot), this server is
# always-on, online-mode, and keeps its world so segments/state persist between sessions.

services:
  sot-test:
    image: itzg/minecraft-server:java25
    container_name: sot-test
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      # Host port -> MC port. A raw game port (not HTTP) — expose only on a trusted network.
      # Join at <SERVER_HOST>:25700. Pick a host port that is free on your Docker host.
      - "25700:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.2"
      MEMORY: "3G"
      # Real login: only you (an authenticated account) can join.
      ONLINE_MODE: "TRUE"
      # SoT hard-depends on WorldEdit (plugin.yml `depend: [WorldEdit]`). itzg auto-downloads it
      # from Modrinth into plugins/ on first boot and it then persists in ./data/plugins/.
      # WorldEdit + PlugManX from Modrinth. PlugManX (`plugmanx`) lets the CD deploy hot-reload just
      # the SoT plugin via `plugman reload SoT` over RCON instead of restarting the container and
      # kicking players. Its Paper-26.2-compatible build is on the beta channel, so beta versions
      # must be allowed (Spiget/GitHub don't work: Spiget's download of PlugManX is gated, and the
      # GitHub release jars up to 3.0.3 NumberFormatException on Paper's "26.2.build.NNN" version).
      # Both auto-download on first boot; then persist in ./data/plugins/.
      MODRINTH_PROJECTS: worldedit,plugmanx
      MODRINTH_ALLOWED_VERSION_TYPE: beta
      # Grant yourself op so all sot.admin.* perms apply. REPLACE with your Minecraft username.
      OPS: "REPLACE_WITH_MC_USERNAME"
      # A superflat world makes building segments and watching game UX easiest. Remove for normal.
      LEVEL_TYPE: "minecraft:flat"
      # NOTE: no RESOURCE_PACK / RESOURCE_PACK_SHA1 here on purpose. The SoT plugin offers its own
      # pack (config.yml -> resource-pack.url, served by the `pack` sidecar below) together with the
      # zip's current SHA-1, which it hashes at enable. server.properties is only read at startup,
      # so a pack set here could never change hash without a restart -- and without a hash change
      # clients keep their cached copy forever. See deploy/sot-test/README.md.
    volumes:
      # World + config + plugins persist here. CI/scp drops the built jar at ./data/plugins/SoT.jar.
      - ./data:/data
    healthcheck:
      test: [ "CMD", "mc-health" ]
      start_period: 2m
      interval: 10s
      retries: 20

  # Static-file sidecar that serves the SoT resource pack zip over HTTP. The CD job
  # (.github/workflows/resourcepack-deploy.yml) rebuilds ./pack/sot.zip on resourcepack/** changes,
  # then `plugman reload SoT` so the plugin re-hashes it and offers the new pack to everyone online.
  # ./pack is a host dir (gitignored, like ./data); seed it once by running
  # scripts/build-resourcepack.sh and copying the zip to ./pack/sot.zip. Point the plugin at it with
  # resource-pack.url: http://<SERVER_HOST>:25701/sot.zip in data/plugins/SoT/config.yml -- the host
  # address CLIENTS reach (e.g. the Tailscale IP), not this service name.
  pack:
    image: nginx:alpine
    container_name: sot-pack
    restart: unless-stopped
    ports:
      # HTTP. Must match the port in the plugin's resource-pack.url and be reachable by clients.
      - "25701:80"
    volumes:
      - ./pack:/usr/share/nginx/html:ro
